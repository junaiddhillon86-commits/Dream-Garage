<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conatct-Us</title>
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
   <div class="menu"><a href="index.html">Home</a></div>
   <div class="main">
        <div class="top">
            <p>Get in touch</p>
            <p class="h">Contact us</p>
            <p id="po">Have a question or want to get in touch? Send us a message and we'll get back to you.
            </p>
        </div>

        <form class="contact-form">
            <div class="field">
                <input type="email" name="email" placeholder="Your email" required>
            </div>
            <div class="field">
                <textarea name="message" placeholder="Your message" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>

        <hr class="divider">

        <div class="direct">
            <span class="label">Email</span>
            <a href="mailto:hello@yourbrand.com">hello@yourbrand.com</a>
        </div>

        <div class="socials">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Facebook</a>
            <a href="#" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>

</html>
